name: Publish verified 0.6.0rc2 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-0.6.0rc2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lkdx0220/ai-code-quality-skill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ai-code-quality/0.6.0rc2/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download frozen candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.0rc2 --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern ai_code_quality-0.6.0rc2-py3-none-any.whl \
            --pattern ai_code_quality-0.6.0rc2.tar.gz
      - name: Verify exact accepted package bytes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "ai_code_quality-0.6.0rc2-py3-none-any.whl": (
                  145143,
                  "bde0b1a7c61a1779951bf022e0db208dfe5dc1d21df59ddd52c865e32e3d5dd9",
              ),
              "ai_code_quality-0.6.0rc2.tar.gz": (
                  217447,
                  "ddc607a2f7df1fb7f21e38282f3c2dde51b54447b22ff4960cd1a81e6304ed18",
              ),
          }
          directory = Path("dist")
          assert {p.name for p in directory.iterdir()} == set(expected)
          for name, (size, digest) in expected.items():
              data = (directory / name).read_bytes()
              assert len(data) == size, name
              assert hashlib.sha256(data).hexdigest() == digest, name
              print("Verified:", name)
          PY
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
